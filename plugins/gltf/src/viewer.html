<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>glTF 查看器</title>
    <link rel="stylesheet" href="viewer.css" />
    <script type="module" src="viewer.js"></script>
  </head>
  <body>
    <canvas
      id="view"
      tabindex="0"
      aria-label="三维模型。拖动旋转，滚轮缩放，右键拖动平移。"
    ></canvas>
    <ul id="warnings" class="panel warnings" role="status" hidden></ul>
    <div class="toolbar" role="toolbar" aria-label="视图">
      <button id="fit" type="button" title="让整个模型回到视野中（F）" disabled>适应</button>
      <button id="reset" type="button" title="回到初始视角（R）" disabled>重置视角</button>
    </div>
    <footer class="panel footer">
      <span id="info"></span>
      <span class="hint">拖动旋转 · 滚轮缩放 · 右键拖动平移</span>
    </footer>
    <div id="playback" class="panel playback" role="group" aria-label="动画" hidden>
      <select id="clip" aria-label="动画片段" title="动画片段"></select>
      <button id="play" type="button" title="播放或暂停（空格）">暂停</button>
      <input id="time" type="range" min="0" max="1" step="any" value="0" aria-label="时间" />
      <span id="clock"></span>
    </div>
  </body>
</html>
